name: Frontend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/test_frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/test_frontend/**'
  workflow_dispatch:
    inputs:
      frontend_url:
        description: 'Test stand'
        default: 'https://app.vaiz.dev'
        type: choice
        options:
          - https://app.vaiz.dev
          - https://app.vaiz.com
      update_snapshots:
        description: 'Update baseline snapshots'
        default: false
        type: boolean
      snapshot_test:
        description: 'One or more test names separated by comma (e.g. test_a, test_b). Leave empty to run all.'
        default: ''
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  frontend-tests:
    runs-on: ${{ github.event.inputs.frontend_url == 'https://app.vaiz.com' && 'ubuntu-latest' || 'ubuntu-latest-m' }}
    timeout-minutes: 30

    env:
      FRONTEND_STAND: ${{ github.event.inputs.frontend_url == 'https://app.vaiz.com' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Print test environment
        run: |
          echo "## Frontend Tests" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Stand** | $FRONTEND_STAND |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ github.event.inputs.frontend_url || 'https://app.vaiz.dev' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.head_ref || github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY

      - name: ☁️ Setup VPN
        if: env.FRONTEND_STAND != 'prod'
        uses: ./.github/actions/cloudflare
        with:
          CLOUDFLARE_AUTH_CLIENT_ID: ${{ vars.CF_TOKEN_NAME }}
          CLOUDFLARE_AUTH_CLIENT_SECRET: ${{ secrets.CF_TOKEN }}

      - name: Adding static DNS
        if: env.FRONTEND_STAND != 'prod'
        run: echo "10.114.16.5 app.vaiz.dev api.vaiz.dev" | sudo tee -a /etc/hosts

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Add tests to PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)/tests" >> $GITHUB_ENV

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install chromium --with-deps
          fi

      - name: Clean old Allure results
        run: rm -rf allure-results

      - name: Set Allure environment metadata
        run: |
          mkdir -p allure-results
          echo "TEST_SCOPE=frontend" >> allure-results/environment.properties
          echo "FRONTEND_URL=${{ github.event.inputs.frontend_url || 'https://app.vaiz.dev' }}" >> allure-results/environment.properties

      - name: Update baseline snapshots
        if: github.event.inputs.update_snapshots == 'true'
        run: |
          RAW="${{ github.event.inputs.snapshot_test }}"
          TARGET=$(echo "$RAW" | sed 's/[[:space:]]*,[[:space:]]*/  or /g')
          if [ -z "$TARGET" ]; then
            pytest tests/test_frontend/ -m frontend --update-snapshots
          else
            pytest tests/test_frontend/ -m frontend -k "$TARGET" --update-snapshots
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin "$BRANCH"
          git add -f tests/test_frontend/tests/**/__snapshots__/**/*.png
          git diff --cached --quiet || git commit -m "chore: update VRT baselines on CI"
          git push origin "$BRANCH"

      - name: Run frontend tests
        continue-on-error: true
        run: |
          RAW="${{ github.event.inputs.snapshot_test }}"
          TARGET=$(echo "$RAW" | sed 's/[[:space:]]*,[[:space:]]*/  or /g')
          if [ -z "$TARGET" ]; then
            pytest tests/test_frontend/ -m frontend --alluredir=allure-results --slowmo 100 --reruns 1 --reruns-delay 5 --maxfail=5
          else
            pytest tests/test_frontend/ -m frontend -k "$TARGET" --alluredir=allure-results --slowmo 100 --reruns 1 --reruns-delay 5 --maxfail=5
          fi


      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          gh_pages: gh-pages/frontend/${{ env.FRONTEND_STAND }}
          keep_reports: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Allure redirect for subdirectory
        if: always()
        run: sudo sed -i "s|URL=https://vaizcom.github.io/autotests/|URL=https://vaizcom.github.io/autotests/frontend/${{ env.FRONTEND_STAND }}/|" allure-history/index.html

      - name: Prepare deploy directory
        if: always()
        run: |
          mkdir -p deploy/frontend/${{ env.FRONTEND_STAND }}
          cp -r allure-history/* deploy/frontend/${{ env.FRONTEND_STAND }}/
          cat > deploy/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head><meta charset="utf-8"><title>Allure Reports</title>
          <style>
            body{font-family:sans-serif;max-width:500px;margin:80px auto}
            h1{margin-bottom:32px}
            h2{margin:24px 0 8px;font-size:20px}
            a{display:block;margin:4px 0 4px 16px;font-size:18px}
          </style>
          </head><body>
          <h1>Allure Reports</h1>
          <h2>Frontend Tests</h2>
          <a href="frontend/dev/">Dev</a>
          <a href="frontend/prod/">Prod</a>
          <h2>Backend Tests</h2>
          <a href="backend/dev/">Dev</a>
          <a href="backend/kuber_dev/">Kuber Dev</a>
          <a href="backend/kuber_uat/">Kuber UAT</a>
          </body></html>
          HTMLEOF

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
          full_commit_message: "deploy: frontend ${{ env.FRONTEND_STAND }} allure report"

      - name: Add Allure link to summary
        if: always()
        run: |
          REPORT_NUM=$(ls -d allure-history/[0-9]* 2>/dev/null | sort -n | tail -1 | xargs basename)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Allure Report**: [Открыть отчёт](https://vaizcom.github.io/autotests/frontend/${{ env.FRONTEND_STAND }}/${REPORT_NUM}/)" >> $GITHUB_STEP_SUMMARY

      - name: Comment Allure Report link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = './allure-report/widgets/summary.json';

            let status = "✅ Tests passed";
            try {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const { failed, broken } = summary.statistic;
              if (failed > 0 || broken > 0) {
                status = "❌ Tests failed";
              }
            } catch (e) {
              status = "⚠️ Could not read test results";
            }

            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const time = new Date().toISOString();
            const link = "https://vaizcom.github.io/autotests/frontend/${{ env.FRONTEND_STAND }}/";

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.payload.repository.owner.login,
              repo: context.payload.repository.name,
              body: `${status}\n\n🧪 **Allure Report** для коммита \`${sha}\`\n\n📄 [Открыть отчёт](${link})\n\n🕒 ${time}`
            });
