name: Backend Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tests/test_backend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tests/test_backend/**'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Which tests to run?'
        default: 'backend'
        type: choice
        options: [ backend ]
      test_stand:
        description: 'Which test stand to run?'
        default: 'dev'
        type: choice
        options: [ dev, kuber_dev, kuber_uat ]

permissions:
  contents: write 
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest-m
    timeout-minutes: 60

    env:
      TEST_SCOPE: ${{ github.event.inputs.test_scope || 'backend' }}

    steps:
      - uses: actions/checkout@v4

      # 🧠 Определяем стенд из .env (push / pull_request)
      - name: Determine test stand from .env
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          STAND=$(grep -oP '^TEST_STAND_NAME=\K.*' .env || echo "dev")
          echo "TEST_STAND_NAME=$STAND" >> $GITHUB_ENV
          echo "🧠 Test stand from .env: $STAND" >> $GITHUB_STEP_SUMMARY

      # 🧠 Получаем стенд из input (если ручной запуск)
      - name: Set test stand from input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "TEST_STAND_NAME=${{ github.event.inputs.test_stand }}" >> $GITHUB_ENV

      # ✅ Добавляем tests/ в PYTHONPATH (для from config import settings)
      - name: Add tests to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/tests" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      # ✅ Импортируем settings.py, чтобы API_URL записался в GITHUB_ENV
      - name: Export API_URL from settings.py
        run: python -c "from config import settings"

      - name: Display selected options
        run: |
          echo "Test scope: $TEST_SCOPE"
          echo "Test stand: $TEST_STAND_NAME"
          echo "API URL: $API_URL"

      - name: ❌ Clean old Allure results
        run: rm -rf allure-results

      # ✅ Allure Environment: API_URL теперь доступен
      - name: Set Allure environment metadata
        run: |
          mkdir -p allure-results
          echo "TEST_SCOPE=$TEST_SCOPE" >> allure-results/environment.properties
          echo "TEST_STAND=$TEST_STAND_NAME" >> allure-results/environment.properties
          echo "API_URL=$API_URL" >> allure-results/environment.properties

      - name: Print test environment
        run: |
          echo "## Backend Tests" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Stand** | $TEST_STAND_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scope** | $TEST_SCOPE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.head_ref || github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${GITHUB_SHA::7} |" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Check if the API is available from the agent
        continue-on-error: false
        run: curl -m 10 $API_URL/healthCheck

      # 🔍 Для PR — запускаем только изменённые тестовые файлы
      - name: Detect changed test files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            | grep '^tests/test_backend/.*\.py$' \
            | grep -v '__pycache__' \
            | grep -v '__init__' \
            | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED" ]; then
            echo "🔍 Changed test files: $CHANGED" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔍 No test files changed — running all backend tests" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ✅ Run tests with Allure
        continue-on-error: true
        run: |
          CHANGED="${{ steps.changed.outputs.files }}"
          if [ -n "$CHANGED" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running changed files only: $CHANGED"
            pytest $CHANGED --alluredir=allure-results -m "$TEST_SCOPE" --reruns 1 --reruns-delay 10 --maxfail=50
          else
            echo "Running all backend tests"
            pytest . --alluredir=allure-results -m "$TEST_SCOPE" --reruns 1 --reruns-delay 10 --maxfail=50
          fi

      - name: Check allure-results content
        run: ls -lah allure-results

      - name: 🕘 Get Allure history
        uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: 📊 Generate Allure Report and Deploy
        uses: simple-elf/allure-report-action@v1.13
        if: ${{ !cancelled() }}
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          gh_pages: gh-pages/backend/${{ env.TEST_STAND_NAME }}
          keep_reports: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Allure redirect for subdirectory
        if: ${{ !cancelled() }}
        run: sudo sed -i "s|URL=https://vaizcom.github.io/autotests/|URL=https://vaizcom.github.io/autotests/backend/${{ env.TEST_STAND_NAME }}/|" allure-history/index.html

      - name: Prepare deploy directory
        if: ${{ !cancelled() }}
        run: |
          mkdir -p deploy/backend/${{ env.TEST_STAND_NAME }}
          cp -r allure-history/* deploy/backend/${{ env.TEST_STAND_NAME }}/
          cat > deploy/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head><meta charset="utf-8"><title>Allure Reports</title>
          <style>
            body{font-family:sans-serif;max-width:500px;margin:80px auto}
            h1{margin-bottom:32px}
            h2{margin:24px 0 8px;font-size:20px}
            a{display:block;margin:4px 0 4px 16px;font-size:18px}
          </style>
          </head><body>
          <h1>Allure Reports</h1>
          <h2>Frontend Tests</h2>
          <a href="frontend/dev/">Dev</a>
          <a href="frontend/prod/">Prod</a>
          <h2>Backend Tests</h2>
          <a href="backend/dev/">Dev</a>
          <a href="backend/kuber_dev/">Kuber Dev</a>
          <a href="backend/kuber_uat/">Kuber UAT</a>
          </body></html>
          HTMLEOF

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ !cancelled() }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
          full_commit_message: "deploy: backend ${{ env.TEST_STAND_NAME }} allure report"

      - name: Add Allure link to summary
        if: ${{ !cancelled() }}
        run: |
          REPORT_NUM=$(ls -d allure-history/[0-9]* 2>/dev/null | sort -n | tail -1 | xargs basename)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Allure Report**: [Открыть отчёт](https://vaizcom.github.io/autotests/backend/${{ env.TEST_STAND_NAME }}/${REPORT_NUM}/)" >> $GITHUB_STEP_SUMMARY

      - name: 📝 Comment Allure Report link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = './allure-report/widgets/summary.json';

            let status = "✅ Tests passed";
            try {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const { failed, broken } = summary.statistic;
              if (failed > 0 || broken > 0) {
                status = "❌ Tests failed";
              }
            } catch (e) {
              status = "⚠️ Could not read test results";
            }

            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const time = new Date().toISOString();
            const link = "https://vaizcom.github.io/autotests/backend/${{ env.TEST_STAND_NAME }}/";

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.payload.repository.owner.login,
              repo: context.payload.repository.name,
              body: `${status}\n\n🧪 **Allure Report for Commit \`${sha}\`**\n\n📄 [Click to view Allure Report](${link})\n\n🕒 Generated at: \`${time}\``
            });
